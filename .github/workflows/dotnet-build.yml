name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: |
    10.0.x
    11.0.x

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/DotNET/**"
      - "*.props"
      - "*.targets"
      - "*.slnx"
      - "global.json"
      - "scripts/**"
      - ".github/scripts/run-specifications.sh"
      - ".github/scripts/run-specifications.test.mjs"
      - ".github/workflows/dotnet-build.yml"
      - ".globalconfig"
      - ".editorconfig"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Debug
        run: dotnet build --configuration Debug

      - name: Verify specification runner
        run: bash .github/scripts/run-specifications.sh --self-test

      # The version is a sentinel, not a release. Package validation compares assembly versions, and one
      # below the baseline is rejected on that alone before the API surface is ever looked at - so it has to
      # be set on the build, since the pack below reuses what this produces.
      - name: Build Release
        run: dotnet build --configuration Release -p:Version=9999.0.0

      - name: Run specifications
        run: bash .github/scripts/run-specifications.sh Release

      - name: Build .NET 10 specifications
        run: dotnet build --configuration Release -p:Version=9999.0.0 -p:SpecTargetFramework=net10.0

      - name: Run .NET 10 specifications
        run: bash .github/scripts/run-specifications.sh Release net10.0

      - name: Upload failed specification results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: specification-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 3

      # Package validation only runs on pack, so a binary break was invisible until the release failed on
      # main - which is how eight versions came to be tagged with no package on NuGet. Packing here puts the
      # break in the pull request that causes it, which is what Directory.Build.props already claims happens.
      - name: Pack
        run: dotnet pack --no-build --configuration Release -o ./Artifacts/NuGet -p:Version=9999.0.0

      - name: Verify package consumers
        run: ./scripts/verify-package-consumers.sh 9999.0.0 ./Artifacts/NuGet
